<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Portal Exclusivo do Cliente - Área Segura Pro">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F172A">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <title>Portal do Cliente - Área Segura</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Página independente do Gerenciador administrativo: nenhum código ou
       dado do admin é carregado aqui, só o necessário pro portal do cliente. -->
  <svg style="display:none" aria-hidden="true">
    <symbol id="icon-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></symbol>
    <symbol id="icon-snowflake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></symbol>
    <symbol id="icon-flame" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2c1 4-4 5-4 10a4 4 0 0 0 8 0c0-2-1-3-1-5 2 1 3 3 3 6a6 6 0 0 1-12 0c0-6 5-7 6-11z"/></symbol>
    <symbol id="icon-hourglass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12"/><path d="M6 21h12"/><path d="M7 3c0 6 5 6 5 9s-5 3-5 9"/><path d="M17 3c0 6-5 6-5 9s5 3 5 9"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
    <symbol id="icon-log-out" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
    <symbol id="icon-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="1"/><line x1="8" y1="7" x2="8" y2="7"/><line x1="12" y1="7" x2="12" y2="7"/><line x1="16" y1="7" x2="16" y2="7"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="15"/></symbol>
  </svg>

  <!-- ============================================ -->
  <!-- LOGIN DO PORTAL -->
  <!-- ============================================ -->
  <div id="portal-login-screen" class="lock-screen-overlay active">
    <div class="lock-container">
      <img src="logo.png" alt="Logo" class="lock-logo">
      <h2 class="lock-title">Portal do Cliente</h2>
      <p class="lock-subtitle">Entre com o usuário e a senha de acesso do laboratório</p>

      <div class="detail-field" style="width:100%; text-align:left; margin-bottom:12px;">
        <label class="detail-label" for="portal-login-user">Usuário</label>
        <input type="text" class="detail-input" id="portal-login-user" autocomplete="username" autocapitalize="off" onkeydown="if(event.key==='Enter') document.getElementById('portal-login-pass').focus()">
      </div>
      <div class="detail-field" style="width:100%; text-align:left; margin-bottom:20px;">
        <label class="detail-label" for="portal-login-pass">Senha</label>
        <input type="password" class="detail-input" id="portal-login-pass" autocomplete="current-password" onkeydown="if(event.key==='Enter') submitPortalLogin()">
      </div>

      <button class="btn-primary" style="width:100%;" onclick="submitPortalLogin()">Entrar</button>
      <p id="portal-login-error" style="color:var(--accent-red); font-size:12px; margin-top:12px; min-height:16px;"></p>
    </div>
  </div>

  <!-- ============================================ -->
  <!-- PAINEL DO CLIENTE -->
  <!-- ============================================ -->
  <div id="portal-app" style="display:none;">
    <header class="app-header">
      <img src="logo.png" alt="Logo" class="header-logo">
      <div class="header-text-container">
        <span class="header-title" id="portal-client-name">Cliente</span>
        <span class="header-status-indicator">
          <span class="status-dot-online"></span>
          <span class="header-status-text">Portal Exclusivo</span>
        </span>
      </div>
      <button class="header-refresh" onclick="exitPortal()" title="Sair" aria-label="Sair"><svg class="icon"><use href="#icon-log-out"/></svg></button>
    </header>

    <main class="main-content">
      <div class="section-title" style="margin-bottom:12px;"><svg class="icon"><use href="#icon-monitor"/></svg> Suas Máquinas</div>
      <div id="portal-machines-list"></div>
    </main>
  </div>

  <script src="portal.js"></script>
</body>
</html>
